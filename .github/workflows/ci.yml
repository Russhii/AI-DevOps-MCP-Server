name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  docker:
    needs: test            # only builds if tests + lint passed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ai-devops-mcp:${{ github.sha }} .

  # deploy:               # Phase 14: add after choosing an AWS target (see docs/AWS_DEPLOYMENT.md)
  #   needs: [test, docker]
  #   if: github.ref == 'refs/heads/main'
